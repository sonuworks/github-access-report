spring:
  application:
    name: github-access

server:
  port: 8080

github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    per-page: 100
    concurrency: 20
    connect-timeout-seconds: 10
    read-timeout-seconds: 30

logging:
  level:
    com.example.githubaccess: INFO
    com.example.githubaccess.client: DEBUG
